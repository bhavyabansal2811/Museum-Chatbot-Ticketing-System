<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Museum Ticket Chatbot & Admin System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <!-- Main Container -->
  <div class="app-container">
    <div class="header">
      <div class="brand">
        <h1>🏛️ National Heritage Museum</h1>
        <p class="subtitle">Chatbot Ticketing & Visitor System</p>
      </div>
      <div class="controls">
        <div id="lang-selector">
          <label for="lang">Language / भाषा:</label>
          <select id="lang">
            <option value="en" selected>English</option>
            <option value="hi">हिंदी</option>
          </select>
        </div>
        <button id="reset-btn" class="btn btn-secondary" title="Reset Chat">🔄 Reset</button>
        <button id="dashboard-btn" class="btn btn-primary" title="Open Admin Dashboard">📊 Dashboard</button>
      </div>
    </div>

    <!-- Chat Box -->
    <div id="chat" class="chat-box"></div>

    <!-- Input Bar -->
    <div id="input-area">
      <input type="text" id="user-input" placeholder="Type your reply here..." autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Admin Dashboard Modal -->
  <div id="dashboard-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📊 Museum Management & Analytics Dashboard</h2>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <!-- Metric Cards -->
      <div class="stats-grid">
        <div class="card stat-card">
          <div class="stat-icon">🎟️</div>
          <div class="stat-info">
            <span class="stat-label">Total Bookings</span>
            <span id="stat-total-tickets" class="stat-value">0</span>
          </div>
        </div>

        <div class="card stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-info">
            <span class="stat-label">Total Revenue</span>
            <span id="stat-total-revenue" class="stat-value">₹0</span>
          </div>
        </div>

        <div class="card stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-info">
            <span class="stat-label">Adult / Child / Senior</span>
            <span id="stat-category-split" class="stat-value">0 / 0 / 0</span>
          </div>
        </div>
      </div>

      <!-- Live Tickets Table -->
      <div class="table-container card">
        <div class="table-header">
          <h3>Recent Issued Tickets</h3>
          <button id="refresh-dashboard-btn" class="btn btn-sm">🔄 Refresh Data</button>
        </div>
        <div class="table-scroll">
          <table id="tickets-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Visitor Name</th>
                <th>Date</th>
                <th>Time Slot</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tickets-tbody">
              <tr>
                <td colspan="7" class="loading-cell">Loading transactions...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
