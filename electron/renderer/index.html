<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Museum Ticket Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <div class="header">
    <h1 id="title">🏛️ Museum Ticket Chatbot</h1>
    <div class="controls">
      <div id="lang-selector">
        <label for="lang">Language / भाषा:</label>
        <select id="lang">
          <option value="en" selected>English</option>
          <option value="hi">हिंदी</option>
        </select>
      </div>
      <button id="reset-btn" title="Reset Chat">🔄 Reset</button>
    </div>
  </div>

  <div id="chat" class="chat-box"></div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="Type your reply here..." autocomplete="off" />
    <button id="send-btn">Send</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
